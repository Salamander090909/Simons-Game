<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simons Game</title>
    <link rel="stylesheet" href="./css/main.css">
    <script src="./js/main.js" defer></script>
</head>
<body>
    <div class="sectionWrapper">
        <h1>Simons Game</h1>
        <h1 class="hidden" id="gameOver">GAME OVER</h1>
        <h2 id="score">Score: 0</h2>
        <li>
            <div class="green" id="green"></div>
            <div class="red" id="red"></div>
        </li>
        <li>
            <div class="yellow" id="yellow"></div>
            <div class="blue" id="blue"></div>
        </li>

        <button id="GameBegin">Start Game</button>
    </div>
    
</body>
</html>
